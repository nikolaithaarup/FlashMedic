name: Diagnose FlashMedic login

on:
  push:
    branches:
      - diagnostic/otp-production-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test login proxy
        run: npx tsx scripts/testSynapseEmailProxy.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Detailed production routing diagnostics (no emails)
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const targets = [
            ["Portal home", "https://portal.synapsestudio.dk/", "GET"],
            ["Portal OTP", "https://portal.synapsestudio.dk/api/auth/flashmedic", "POST"],
            ["FlashMedic home", "https://flashmedic.synapsestudio.dk/", "GET"],
            ["FlashMedic old API", "https://flashmedic.synapsestudio.dk/api/weekly-score", "GET"],
            ["FlashMedic new API", "https://flashmedic.synapsestudio.dk/api/synapse-email", "POST"],
          ];
          for (const [name,url,method] of targets) {
            try {
              const response = await fetch(url, {
                method,
                ...(method === "POST" ? {
                  headers: {"Content-Type":"application/json"},
                  body:JSON.stringify({operation:"request",email:"not-an-email"}),
                } : {}),
                redirect:"manual",
                signal:AbortSignal.timeout(15000),
              });
              const body = await response.text();
              let code = "<non-JSON>";
              try { code = JSON.parse(body).error ?? "-"; } catch {}
              const snippet = String(body).replace(/[\r\n]/g," ").slice(0,200);
              console.log(JSON.stringify({
                name,status:response.status,type:response.headers.get("content-type"),
                server:response.headers.get("server"),
                vercelError:response.headers.get("x-vercel-error"),
                location:response.headers.get("location"),
                code,bodyStart:snippet,
              }));
            } catch (error) {
              console.error(name + " NETWORK_ERROR: " + String(error).slice(0,200));
            }
          }
          NODE
      - name: Check Vercel deploy secret availability (booleans only)
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!key}" ]; then echo "$key configured: yes"; else echo "$key configured: no"; fi
          done
