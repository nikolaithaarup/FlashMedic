name: Verify guest email login entry

on:
  push:
    branches:
      - ux/guest-email-entry-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Guest login UI regression
        run: npx tsx scripts/testGuestEmailEntry.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Progress sync checks
        run: npm run validate:progress-sync
      - name: PWA validation
        run: npm run validate:pwa
