<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#083f4f" />
    <title>FlashMedic er offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10161c; color: #f8f9fa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 480px; padding: 24px; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; background: rgba(8,36,44,.9); }
      h1 { margin-top: 0; font-size: 1.7rem; }
      p { color: #e9ecef; line-height: 1.5; }
      button { min-height: 48px; border: 0; border-radius: 12px; padding: 0 18px; color: white; background: #0a7ea4; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>FlashMedic er offline</h1>
      <p>Appen er endnu ikke færdiggjort til offline brug på denne enhed. Gå online én gang, og vent til indholdet er hentet.</p>
      <button onclick="location.reload()">Prøv igen</button>
    </main>
  </body>
</html>
